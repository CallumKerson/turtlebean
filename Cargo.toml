[package]
name = "turtlebean"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A clean-room beancount parser and lossless writer"
repository = "https://github.com/CallumKerson/turtlebean"
license = "MIT"
keywords = ["accounting", "beancount", "parser", "plaintext"]
categories = ["finance", "parser-implementations"]
# Not on crates.io until the API settles
publish = false

[[test]]
harness = false
name = "conformance"

[dependencies]
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }

[dev-dependencies]
libtest-mimic = "0.8.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
